<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reindirizzamento…</title>

  <!-- Redirect immediato -->
  <meta http-equiv="refresh" content="0; url=https://www.tuodominio.it/" />
  <link rel="canonical" href="https://www.tuodominio.it/" />
  <meta name="robots" content="noindex, nofollow" />

  <script>
    (function () {
      var targetBase = "https://www.tuodominio.it";
      var path = window.location.pathname || "/";
      var qs = window.location.search || "";
      var hash = window.location.hash || "";
      window.location.replace(targetBase + path + qs + hash);
    })();
  </script>
</head>
<body>
  <p>Se non vieni reindirizzato automaticamente, clicca qui:
    <a href="https://www.tuodominio.it/">https://www.tuodominio.it/</a>
  </p>
</body>
</html>
